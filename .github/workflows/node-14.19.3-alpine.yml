name: node-14.19.3-alpine

# Compila em paralelo (um runner por pasta) e publica o binário corrigido desta base.
# Dispara quando algo da pasta, do código comum ou do workflow reutilizável muda.
on:
  push:
    branches: [main]
    paths:
      - 'node-14.19.3-alpine/**'
      - 'common/**'
      - '.github/workflows/_build.yml'
      - '.github/workflows/node-14.19.3-alpine.yml'
  workflow_dispatch:
    inputs:
      force:
        description: Recompilar mesmo que a tag já exista no registro
        type: boolean
        default: false

concurrency:
  group: build-node-14.19.3-alpine
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      folder: node-14.19.3-alpine
      force: ${{ inputs.force || false }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
